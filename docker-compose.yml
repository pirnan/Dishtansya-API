services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dishtansya-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:qJ8+kFj83gUeD4zK8W3X9N3eE8L2Z6P4X9Y0M7K5R1Q=
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - QUEUE_CONNECTION=sync
    command: >
      sh -c "touch /var/www/html/database/database.sqlite &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
